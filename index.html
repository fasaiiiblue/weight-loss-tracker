  // ================== แท็บน้ำหนัก ==================
  async function loadBody(silent) {
    if (bodyLoading) return;
    bodyLoading = true;
    try {
      bodyCache = (await api("body")).entries || [];
      if (isActive("scrBody")) renderBody();
      if (isActive("scrHome")) renderHome();
    } catch (e) {
      if (!silent && !bodyCache) $("bodyList").innerHTML = `<div class="muted" style="padding: 10px 0;">โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้งค่ะ</div>`;
      if (!bodyCache) bodyCache = [];
    } finally { bodyLoading = false; }
  }
  function bodyEntries() {
    const server = bodyCache || [], ids = new Set(server.map(e => e.id));
    const pend = getPending().filter(p => p.kind === "body" && !ids.has(p.requestId))
      .map(p => ({ id: p.requestId, date: p.payload.date, weight: Number(p.payload.weightKg) || null, waist: Number(p.payload.waistCm) || null, ts: Date.now(), pending: true }));
    return server.concat(pend).sort((a, b) => a.date > b.date ? 1 : a.date < b.date ? -1 : a.ts - b.ts);
  }
  function renderBody() {
    if (!patient) return;
    const list = bodyEntries(), ws = list.filter(e => e.weight), was = list.filter(e => e.waist);
    const lw = ws[ws.length - 1], fw = ws[0], lwa = was[was.length - 1];
    const tile = (l, v, s) => `<div class="mini"><div class="lbl">${l}</div><div class="val">${v}</div><div class="muted small">${s}</div></div>`;
    const diff = lw && fw ? lw.weight - fw.weight : 0;
    $("bodyTiles").innerHTML =
      tile("น้ำหนักล่าสุด", lw ? `${fmt1(lw.weight)} <small>กก.</small>` : "–", lw ? thaiShort(lw.date) : "ยังไม่มีข้อมูล") +
      tile("เปลี่ยนแปลงทั้งหมด", ws.length > 1 ? `${diff <= 0 ? "▼" : "▲"} ${fmt1(Math.abs(diff))} <small>กก.</small>` : "–", ws.length > 1 ? `${fmt1(Math.abs(diff / fw.weight * 100))}% ตั้งแต่ ${thaiShort(fw.date)}` : "บันทึก 2 ครั้งขึ้นไป") +
      tile("BMI", lw && patient.heightCm ? fmt1(lw.weight / Math.pow(patient.heightCm / 100, 2)) : "–", patient.heightCm ? `ส่วนสูง ${fmt1(patient.heightCm)} ซม.` : "ใส่ส่วนสูงที่เมนู ฉัน") +
      tile("รอบเอวล่าสุด", lwa ? `${fmt1(lwa.waist)} <small>ซม.</small>` : "–", lwa ? thaiShort(lwa.date) : "ยังไม่มีข้อมูล");
    const pts = (metric === "weight" ? ws : was).map(e => ({ date: e.date, value: e[metric] }));
    $("chartTitle").innerText = metric === "weight" ? "น้ำหนัก (กก.)" : "รอบเอว (ซม.)";
    renderLineChart($("bodyChart"), pts, { unit: metric === "weight" ? "กก." : "ซม.", label: metric === "weight" ? "น้ำหนัก" : "รอบเอว" });
    const rows = list.slice().reverse().slice(0, 60);
    $("bodyList").innerHTML = rows.length ? rows.map(e => `<div class="li"><div>${thaiDate(e.date)} ${e.pending ? '<span class="tag-pend">รอส่ง</span>' : ""}</div>
      <div style="text-align: right;">${e.weight ? `<b>${fmt1(e.weight)}</b> กก.` : ""}${e.weight && e.waist ? " · " : ""}${e.waist ? `เอว ${fmt1(e.waist)} ซม.` : ""}</div></div>`).join("")
      : `<div class="muted" style="padding: 10px 0;">ยังไม่มีรายการ เริ่มบันทึกครั้งแรกได้เลยค่ะ</div>`;
  }
  function setMetric(m) { metric = m; $("segW").classList.toggle("on", m === "weight"); $("segWa").classList.toggle("on", m === "waist"); renderBody(); }

  // ================== แท็บประวัติ ==================
  async function loadHistory(silent) {
    if (histLoading) return;
    histLoading = true;
    try {
      historyCache = (await api("history")).injections || [];
      if (isActive("scrHistory")) renderHistory();
      if (isActive("scrHome")) renderHome();
    } catch (e) {
      if (!silent && !historyCache) $("historyList").innerHTML = `<div class="card muted" style="text-align: center;">โหลดประวัติไม่สำเร็จ ลองใหม่อีกครั้งค่ะ</div>`;
    } finally { histLoading = false; }
  }
  function renderHistory() {
    if (!historyCache) { $("historyList").innerHTML = `<div class="card muted" style="text-align: center;">กำลังโหลดประวัติ...</div>`; return; }
    const list = historyCache;
    const pc = getPending().filter(p => p.kind === "injection").length;
    const note = pc ? `<div class="notice" style="display: block;">⏳ มี ${pc} รายการรอส่งเข้าระบบ จะแสดงที่นี่หลังส่งสำเร็จ</div>` : "";
    if (!list.length) { $("historyList").innerHTML = note + `<div class="card" style="text-align: center;"><div style="width: 120px; margin: 0 auto;">${plantSVG(0)}</div><div class="muted">ยังไม่มีประวัติ บันทึกเข็มแรกได้จากหน้าหลักค่ะ</div></div>`; return; }
    const pens = {};
    list.forEach(it => (pens[it.penNumber] = pens[it.penNumber] || []).push(it));
    const keys = Object.keys(pens).map(Number).sort((a, b) => b - a);
    $("historyList").innerHTML = note + keys.map((k, idx) => {
      const items = pens[k].sort((a, b) => a.doseNumber - b.doseNumber || (a.date > b.date ? 1 : -1));
      const s = items.find(i => i.penStrength);
      return `<div class="pen-group"><button type="button" class="pen-head" onclick="togglePen(${k})">
          <span><span class="h2">🖊️ ด้ามที่ ${k}</span> <span class="muted small">${s ? fmtMg(s.penStrength) + " · " : ""}${items.length} ครั้ง</span></span>
          <span id="pa${k}" class="muted">${idx === 0 ? "▲" : "▼"}</span></button>
        <div class="pen-body ${idx === 0 ? "open" : ""}" id="pg${k}">${items.map(d => `
          <div class="hi ${d.special ? "special" : ""}"><div class="row between"><b>ครั้งที่ ${Number(d.doseNumber)}${d.special ? " ⭐ พิเศษ" : ""}</b><span class="muted small">${d.date ? thaiDate(d.date) : "-"}</span></div>
            <div class="small">💉 ${d.dose ? fmtMg(d.dose) : "-"} ${d.clicks ? `<span class="muted">(${Number(d.clicks)} คลิก)</span>` : ""} · 📍 ${esc(d.site || "-")}</div>
            <div class="small muted">อาการ: ${esc(d.sideEffects)}</div>${d.redFlag ? `<div class="hi-red">⚠️ ${esc(d.redFlag)}</div>` : ""}</div>`).join("")}</div></div>`;
    }).join("");
  }
  function togglePen(k) { const o = $("pg" + k).classList.toggle("open"); $("pa" + k).innerText = o ? "▲" : "▼"; }

  // ================== แท็บฉัน ==================
  function renderMe() {
    $("meCard").innerHTML = `<div class="row"><div style="width: 70px; flex: none;">${plantSVG(injStats().total)}</div>
      <div class="grow"><div class="h2">${esc(patient.name)}</div><div class="muted small">HN ${esc(patient.hn || "-")}</div>
      <div class="small" style="margin-top: 4px;">💊 ${esc(patient.medication)}${patient.currentDose ? ` · ${fmtMg(patient.currentDose)}` : ""}</div>
      ${patient.doctor ? `<div class="muted small">แพทย์: ${esc(patient.doctor)}</div>` : ""}</div></div>`;
    $("setNotify").checked = patient.notify !== false;
    $("setPhone").value = patient.phone || "";
    $("setHeight").value = patient.heightCm || "";
  }
  $("btnSaveSettings").addEventListener("click", async () => {
    const b = $("btnSaveSettings"); b.disabled = true; b.innerText = "กำลังบันทึก...";
    try {
      const r = await api("updateSettings", { notify: $("setNotify").checked, phone: $("setPhone").value.trim(), heightCm: $("setHeight").value });
      patient = reapplyPending(r.patient); saveCache(); renderMe();
      showModal("บันทึกเรียบร้อยค่ะ", "อัปเดตการตั้งค่าแล้ว", "⚙️");
    } catch (err) { showModal("บันทึกไม่สำเร็จ", err.code ? err.message : "เชื่อมต่อไม่ได้ กรุณาลองใหม่ค่ะ", "❌"); }
    finally { b.disabled = false; b.innerText = "บันทึกการตั้งค่า"; }
  });

  // ================== กราฟเส้น ==================
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; }
  function renderLineChart(el, points, opt) {
    el.innerHTML = "";
    if (!points.length) { el.innerHTML = `<div class="chart-empty">ยังไม่มีข้อมูล${opt.label}</div>`; return; }
    const W = Math.max(220, el.clientWidth || 320), H = 190, pad = { l: 38, r: 14, t: 14, b: 26 };
    const xs = points.map(p => isoUtc(p.date));
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
    const vals = points.map(p => p.value), vmin = Math.min(...vals), vmax = Math.max(...vals);
    const step = niceStep(Math.max(vmax - vmin, 2) / 4);
    let y0 = Math.floor((vmin - step * 0.5) / step) * step, y1 = Math.ceil((vmax + step * 0.5) / step) * step;
    if (y1 - y0 < step * 2) y1 = y0 + step * 2;
    const sx = v => pad.l + (v - x0) / (x1 - x0) * (W - pad.l - pad.r), sy = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (H - pad.t - pad.b);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.style.width = "100%"; svg.style.height = "auto"; svg.style.display = "block";
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", `กราฟ${opt.label} ${points.length} ครั้ง ล่าสุด ${points[points.length - 1].value} ${opt.unit}`);
    let h = ""; const dec = step < 1 ? 1 : 0;
    for (let v = y0; v <= y1 + 1e-9; v += step) { const y = sy(v); h += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="#E2EFE6"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#6F887C">${v.toFixed(dec)}</text>`; }
    const li = new Set([0, points.length - 1]); if (points.length >= 3 && W > 340) li.add(Math.floor((points.length - 1) / 2));
    [...li].forEach(i => { const a = i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"; h += `<text x="${Math.min(Math.max(sx(xs[i]), pad.l), W - pad.r)}" y="${H - 8}" text-anchor="${a}" font-size="10" fill="#6F887C">${thaiShort(points[i].date)}</text>`; });
    const path = points.map((p, i) => `${i ? "L" : "M"}${sx(xs[i]).toFixed(1)},${sy(p.value).toFixed(1)}`).join(" ");
    h += `<path d="${path} L${sx(xs[xs.length - 1]).toFixed(1)},${H - pad.b} L${sx(xs[0]).toFixed(1)},${H - pad.b} Z" fill="rgba(46,154,91,0.08)"/>`;
    h += `<path d="${path}" fill="none" stroke="#2E9A5B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    h += `<line class="g" y1="${pad.t}" y2="${H - pad.b}" stroke="#9DB8A9" stroke-dasharray="3 3" visibility="hidden"/>`;
    points.forEach((p, i) => { h += `<circle cx="${sx(xs[i])}" cy="${sy(p.value)}" r="4" fill="#2E9A5B" stroke="#fff" stroke-width="2"/>`; });
    h += `<circle class="h" r="6" fill="#0B5C36" stroke="#fff" stroke-width="2" visibility="hidden"/><rect class="hit" x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent"/>`;
    svg.innerHTML = h; el.appendChild(svg);
    const tip = document.createElement("div"); tip.className = "chart-tip"; el.appendChild(tip);
    const g = svg.querySelector(".g"), hi = svg.querySelector(".h");
    const show = ev => {
      const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * (W / r.width);
      let best = 0, bd = Infinity; xs.forEach((x, i) => { const d = Math.abs(sx(x) - mx); if (d < bd) { bd = d; best = i; } });
      const px = sx(xs[best]), py = sy(points[best].value), sc = r.width / W;
      g.setAttribute("x1", px); g.setAttribute("x2", px); g.setAttribute("visibility", "visible");
      hi.setAttribute("cx", px); hi.setAttribute("cy", py); hi.setAttribute("visibility", "visible");
      tip.innerText = `${thaiDate(points[best].date)} · ${fmt1(points[best].value)} ${opt.unit}`; tip.style.display = "block";
      tip.style.left = Math.min(Math.max(px * sc, 70), r.width - 70) + "px"; tip.style.top = py * sc + "px";
    };
    const hide = () => { tip.style.display = "none"; g.setAttribute("visibility", "hidden"); hi.setAttribute("visibility", "hidden"); };
    const hit = svg.querySelector(".hit"); hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show); hit.addEventListener("pointerleave", hide);
  }
  let rsz = null;
  window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (isActive("scrBody")) renderBody(); }, 200); });

  // ================== เริ่มต้น / ซิงก์ ==================
  async function initApp() {
    $("loadingPlant").innerHTML = plantSVG(3, { sway: true });
    if (DEBUG) {
      $("debugBadge").style.display = "block";
      uid = lsGet("smu_test_uid") || ("U_TEST_" + Math.floor(100000 + Math.random() * 900000));
      lsSet("smu_test_uid", uid);
    } else {
      try {
        await withTimeout(liff.init({ liffId: LIFF_ID }), 12000);
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        uid = (await withTimeout(liff.getProfile(), 10000)).userId;
      } catch (e) { console.warn("LIFF:", e); showError("เชื่อมต่อ LINE ไม่สำเร็จ", "กรุณาปิดหน้านี้แล้วเปิดใหม่ผ่านเมนูใน LINE ของศูนย์ฯ ค่ะ"); return; }
    }
    const cached = loadCache();
    if (cached) { cfg = cached.cfg; patient = reapplyPending(cached.patient); goTab("home"); }
    await syncWithServer();
  }

  async function syncWithServer() {
    const res = await flushPending();
    if (res.unauthorized) { showError("ยืนยันตัวตนไม่สำเร็จ", "กรุณาปิดหน้านี้แล้วเปิดใหม่ผ่าน LINE ค่ะ"); return; }
    try {
      const r = await api("bootstrap", {}, 30000);
      cfg = r.config;
      if (r.patient && r.patient.found) {
        patient = reapplyPending(r.patient); saveCache();
        if (!sending && !isActive("scrWizard") && !isActive("scrDone")) goTab(currentTab);
      } else { patient = null; startRegister(); }
    } catch (err) {
      if (err.code === "unauthorized") { showError("ยืนยันตัวตนไม่สำเร็จ", "กรุณาปิดหน้านี้แล้วเปิดใหม่ผ่าน LINE ค่ะ"); return; }
      if (patient) renderNotice("📡 เชื่อมต่อระบบไม่ได้ ขณะนี้แสดงข้อมูลล่าสุดในเครื่อง");
      else showError("เชื่อมต่อระบบไม่สำเร็จ", "กรุณาตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองใหม่อีกครั้งค่ะ");
    }
    if (res.dropped > 0) showModal("มีรายการที่ส่งไม่ได้", `มี ${res.dropped} รายการที่ระบบบันทึกไม่ได้ (ข้อมูลไม่ถูกต้อง)\nกรุณาบันทึกใหม่ หรือติดต่อเจ้าหน้าที่ค่ะ`, "⚠️");
  }

  async function flushPending() {
    const out = { dropped: 0, unauthorized: false };
    for (const it of getPending()) {
      try {
        await api(it.kind === "injection" ? "recordInjection" : "recordBody", it.payload);
        removePending(it.requestId); historyCache = null; bodyCache = null;
      } catch (err) {
        if (isPermanent(err)) { removePending(it.requestId); out.dropped++; }
        else { if (err.code === "unauthorized") out.unauthorized = true; break; }
      }
    }
    return out;
  }

  async function retrySync() {
    const b = $("noticeBtn"); b.disabled = true; b.innerText = "กำลังส่ง...";
    await syncWithServer();
    b.disabled = false; b.innerText = "📤 ส่งอีกครั้ง";
    if (patient) { renderNotice(); if (isActive("scrHome")) renderHome(); }
  }

  window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
