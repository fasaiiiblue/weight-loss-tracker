<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EAF6EE">
  <title>ยาเป๊ะ หุ่นปัง</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EAF6EE;
      --bg-2: #F6FBF7;
      --card: #FFFFFF;
      --forest: #0B5C36;
      --leaf: #2E9A5B;
      --mint: #D6F0DF;
      --sun: #FFC845;
      --sun-soft: #FFF3D1;
      --ink: #16362A;
      --ink-2: #3D5A4D;
      --muted: #6F887C;
      --line: #D9EADF;
      --warn-bg: #FFF5DC; --warn-tx: #8A5A00; --warn-bd: #F5D98A;
      --red-bg: #FDEEEC;  --red-tx: #A8261B;  --red-bd: #F4C2BC;
      --radius: 22px;
      --shadow: 0 6px 20px rgba(11, 92, 54, 0.08);
      --head: 'Mitr', 'Prompt', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Prompt', -apple-system, sans-serif; font-size: 16px; color: var(--ink); background: var(--bg); min-height: 100dvh; }
    button, input, select { font-family: inherit; font-size: 1rem; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative;
      background: linear-gradient(180deg, #E1F3E7 0%, var(--bg) 220px, var(--bg-2) 100%); }
    .screen { display: none; min-height: 100dvh; padding: 18px 18px 110px; }
    .screen.active { display: block; }
    .h1 { font-family: var(--head); font-weight: 500; font-size: 1.5rem; line-height: 1.3; margin: 0; }
    .h2 { font-family: var(--head); font-weight: 500; font-size: 1.12rem; margin: 0; }
    .muted { color: var(--muted); font-size: 0.86rem; }
    .small { font-size: 0.82rem; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }
    .debug { display: none; text-align: center; font-size: 0.72rem; color: var(--red-tx); background: var(--red-bg); border-radius: 10px; padding: 4px; margin-bottom: 10px; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 18px; border: none;
      font-family: var(--head); font-weight: 500; font-size: 1.05rem; padding: 12px 18px; }
    .btn-main { background: var(--forest); color: #fff; box-shadow: 0 8px 18px rgba(11, 92, 54, 0.25); }
    .btn-main:active { transform: translateY(1px); }
    .btn-main:disabled { background: #A9C7B6; box-shadow: none; cursor: not-allowed; }
    .btn-sun { background: var(--sun); color: var(--ink); box-shadow: 0 8px 18px rgba(214, 160, 20, 0.28); }
    .btn-soft { background: var(--mint); color: var(--forest); }
    .btn-ghost { background: #fff; color: var(--ink-2); border: 1.5px solid var(--line); }
    .link { background: none; border: none; color: var(--forest); font-weight: 500; text-decoration: underline; padding: 6px 0; font-size: 0.9rem; }

    /* หน้าหลัก */
    .hello { margin: 4px 2px 14px; }
    .hello .date { font-size: 0.84rem; color: var(--muted); }
    .garden { display: grid; grid-template-columns: 132px 1fr; gap: 6px; align-items: end; padding: 14px 16px 12px; overflow: hidden;
      background: linear-gradient(160deg, #FFFFFF 0%, #F1FAF4 100%); }
    .garden .count { font-family: var(--head); font-size: 2.3rem; font-weight: 600; color: var(--forest); line-height: 1; }
    .garden .count small { font-size: 1rem; font-weight: 500; }
    .streak { display: inline-flex; align-items: center; gap: 6px; background: var(--sun-soft); color: #7A5200; border-radius: 99px;
      padding: 4px 11px; font-size: 0.8rem; font-weight: 500; margin-top: 8px; }
    .due { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; }
    .due.today { background: linear-gradient(150deg, #FFF8E3 0%, #FFFFFF 70%); }
    .due.over { background: linear-gradient(150deg, var(--red-bg) 0%, #FFFFFF 70%); }
    .due-title { font-family: var(--head); font-size: 1.12rem; font-weight: 500; }
    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mini { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); border: none; text-align: left; width: 100%; }
    .mini .lbl { font-size: 0.78rem; color: var(--muted); }
    .mini .val { font-family: var(--head); font-size: 1.35rem; font-weight: 500; margin: 2px 0; }
    .mini .val small { font-size: 0.8rem; font-family: 'Prompt'; color: var(--muted); }
    .notice { background: #FFF1E3; border-radius: 16px; padding: 12px 14px; font-size: 0.86rem; color: #8A4B08; margin-bottom: 14px; display: none; }
    .notice button { margin-top: 8px; border: 1.5px solid #E7A35A; background: #fff; color: #8A4B08; border-radius: 12px; padding: 6px 12px; font-size: 0.84rem; }

    /* แถบยา 4 โดส */
    .doses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0 6px; }
    .dose-cap { height: 12px; border-radius: 99px; background: #E6EFE9; overflow: hidden; position: relative; }
    .dose-cap > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--leaf); }
    .dose-cap > b { position: absolute; top: 0; bottom: 0; background: var(--sun); }
    .doses.big .dose-cap { height: 18px; }

    /* แถบเมนูล่าง */
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 20;
      background: rgba(255, 255, 255, 0.97); border-top: 1px solid var(--line); display: none;
      grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar.show { display: grid; }
    .tab { background: none; border: none; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.74rem; color: var(--muted); border-radius: 14px; }
    .tab svg { width: 24px; height: 24px; }
    .tab.on { color: var(--forest); font-weight: 500; }
    .tab.on svg { background: var(--mint); border-radius: 10px; padding: 2px; width: 34px; }

    /* Wizard */
    .wz-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 18px 10px; margin: -18px -18px 6px; }
    .wz-top { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 42px; height: 42px; border-radius: 14px; border: none; background: #fff; box-shadow: var(--shadow);
      display: grid; place-items: center; flex: none; color: var(--ink); }
    .wz-title { flex: 1; text-align: center; font-family: var(--head); font-size: 0.98rem; color: var(--ink-2); }
    .wz-bar { display: flex; gap: 5px; margin-top: 12px; }
    .wz-bar span { flex: 1; height: 6px; border-radius: 99px; background: #D3E6DA; }
    .wz-bar span.on { background: var(--leaf); }
    .wz-q { font-family: var(--head); font-size: 1.42rem; font-weight: 500; line-height: 1.35; margin: 10px 2px 4px; }
    .wz-sub { color: var(--muted); font-size: 0.9rem; margin: 0 2px 16px; line-height: 1.5; }
    .wz-gap { height: 12px; }
    .wz-content { animation: wzIn 0.24s ease-out; }
    .wz-content.back { animation-name: wzBack; }
    @keyframes wzIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @keyframes wzBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
    .wz-foot { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 15;
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(246,251,247,0) 0%, var(--bg-2) 30%); }

    /* ตัวเลือก */
    .opts { display: grid; gap: 10px; }
    .opts.two { grid-template-columns: 1fr 1fr; }
    .opts.three { grid-template-columns: repeat(3, 1fr); }
    .opts.four { grid-template-columns: repeat(4, 1fr); }
    .opt { background: #fff; border: 2px solid transparent; border-radius: 18px; padding: 14px; text-align: left; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; position: relative; }
    .opt.center { flex-direction: column; justify-content: center; text-align: center; gap: 0; padding: 12px 6px; }
    .opt[aria-pressed="true"] { border-color: var(--forest); background: #F3FBF6; }
    .opt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
      background: var(--forest); color: #fff; font-size: 0.7rem; display: grid; place-items: center; }
    .opt .t { font-family: var(--head); font-size: 1.12rem; font-weight: 500; }
    .opt .s { font-size: 0.8rem; color: var(--muted); }
    .opt .emoji { font-size: 1.5rem; width: 46px; height: 46px; border-radius: 14px; background: var(--mint); display: grid; place-items: center; flex: none; }
    .opt .pill { margin-left: auto; margin-right: 18px; background: var(--mint); color: var(--forest); font-size: 0.82rem; font-weight: 500; border-radius: 99px; padding: 5px 10px; white-space: nowrap; }
    .opt.special[aria-pressed="true"] { border-color: #C98A1B; background: #FFFBEF; }

    .pen-card { background: linear-gradient(150deg, #FFFFFF 0%, #F0FAF3 100%); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .pen-num { font-family: var(--head); font-size: 2rem; font-weight: 600; color: var(--forest); line-height: 1.1; }
    .chip-round { display: inline-block; background: var(--forest); color: #fff; border-radius: 99px; padding: 5px 13px; font-size: 0.88rem; font-weight: 500; }
    .chip-round.special { background: #B97810; }
    .box-warn { background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn-tx); border-radius: 16px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.55; margin: 12px 0; }
    .box-red { background: var(--red-bg); border: 1px solid var(--red-bd); color: var(--red-tx); border-radius: 16px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.55; margin: 12px 0; }
    .box-info { background: var(--mint); color: var(--forest); border-radius: 16px; padding: 12px 14px; font-size: 0.9rem; line-height: 1.5; margin: 12px 0; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 500; font-size: 0.92rem; margin: 0 2px 6px; color: var(--ink-2); }
    .field label .opt-l { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
    .input { width: 100%; height: 54px; border-radius: 16px; border: 2px solid var(--line); background: #fff; padding: 0 16px; font-size: 1.05rem; outline: none; }
    .input:focus { border-color: var(--leaf); }

    .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; margin: 8px 0 6px; }
    .stepper button { height: 64px; border-radius: 20px; border: none; background: #fff; box-shadow: var(--shadow); font-size: 1.8rem; color: var(--forest); font-family: var(--head); }
    .stepper input { height: 84px; border-radius: 24px; border: 2px solid var(--line); background: #fff; text-align: center;
      font-family: var(--head); font-size: 2.6rem; font-weight: 500; color: var(--forest); width: 100%; outline: none; min-width: 0; }
    .stepper input:focus { border-color: var(--leaf); }
    .unit { text-align: center; color: var(--muted); font-size: 0.9rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 9px 14px; font-size: 0.9rem; color: var(--ink-2); }
    .chip[aria-pressed="true"] { border-color: var(--forest); background: #F3FBF6; color: var(--forest); font-weight: 500; }
    .chip.red { border-color: var(--red-bd); color: var(--red-tx); }
    .chip.red[aria-pressed="true"] { background: var(--red-bg); border-color: var(--red-tx); }

    .belly { background: #fff; border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); text-align: center; }
    .quad { fill: #F4FAF6; stroke: #B9D6C4; stroke-width: 2; stroke-dasharray: 5 4; }
    .quad.on { fill: #DDF3E5; stroke: var(--forest); stroke-width: 3; stroke-dasharray: none; }
    .qlabel { font-family: 'Mitr', sans-serif; font-size: 15px; fill: var(--ink-2); pointer-events: none; }

    .sum-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
    .sum-row:last-child { border-bottom: none; }
    .sum-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--mint); display: grid; place-items: center; flex: none; font-size: 1.15rem; }
    .sum-row .k { font-size: 0.78rem; color: var(--muted); }
    .sum-row .v { font-weight: 500; line-height: 1.45; }
    .sum-row .edit { margin-left: auto; background: none; border: none; color: var(--forest); font-size: 0.85rem; text-decoration: underline; padding: 4px; flex: none; }

    /* หน้าฉลอง */
    .done { text-align: center; padding-top: 24px; }
    .done .plant-wrap { width: 210px; margin: 0 auto 6px; }
    .done .h1 { font-size: 1.7rem; }
    .done .lead { color: var(--ink-2); margin: 8px 6px 18px; line-height: 1.6; }
    .pop { transform-box: fill-box; transform-origin: 0% 50%; animation: pop 0.7s cubic-bezier(.2,1.6,.4,1) 0.25s both; }
    .bloom { transform-box: fill-box; transform-origin: center; animation: bloom 0.8s cubic-bezier(.2,1.6,.4,1) 0.3s both; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes bloom { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
    .spark { animation: spark 1.2s ease-out 0.5s both; transform-box: fill-box; transform-origin: center; }
    @keyframes spark { 0% { opacity: 0; transform: scale(0.3); } 40% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.3); } }
    .stat-pill { display: inline-flex; flex-direction: column; background: #fff; border-radius: 18px; padding: 10px 16px; box-shadow: var(--shadow); margin: 4px; min-width: 130px; }
    .stat-pill b { font-family: var(--head); font-size: 1.15rem; font-weight: 500; color: var(--forest); }

    /* น้ำหนัก / ประวัติ */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .chart-wrap { position: relative; width: 100%; min-height: 190px; }
    .chart-empty { text-align: center; color: var(--muted); font-size: 0.86rem; padding: 60px 0; }
    .chart-tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 0.76rem; padding: 5px 9px; border-radius: 10px;
      white-space: nowrap; transform: translate(-50%, -115%); display: none; }
    .seg { display: inline-flex; background: var(--mint); border-radius: 14px; padding: 3px; }
    .seg button { border: none; background: transparent; padding: 6px 12px; border-radius: 11px; font-size: 0.84rem; color: var(--forest); }
    .seg button.on { background: #fff; font-weight: 500; box-shadow: 0 2px 6px rgba(11,92,54,0.12); }
    .li { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 2px; border-bottom: 1px solid #EEF5F0; font-size: 0.92rem; }
    .li:last-child { border-bottom: none; }
    .tag-pend { font-size: 0.7rem; color: #8A4B08; background: #FFF1E3; border-radius: 6px; padding: 1px 6px; }
    .pen-group { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
    .pen-head { width: 100%; border: none; background: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .pen-body { padding: 0 14px 12px; display: none; }
    .pen-body.open { display: block; }
    .hi { border-left: 4px solid var(--leaf); background: #F6FBF8; border-radius: 0 14px 14px 0; padding: 10px 12px; margin-top: 8px; }
    .hi.special { border-left-color: #C98A1B; background: #FFFBEF; }
    .hi-red { color: var(--red-tx); font-size: 0.8rem; font-weight: 500; margin-top: 4px; }

    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
    .switch input { width: 26px; height: 26px; accent-color: var(--forest); flex: none; }

    /* Modal (bottom sheet) */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(22, 54, 42, 0.42); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); text-align: center;
      animation: up 0.22s ease-out; max-height: 88vh; overflow-y: auto; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal .ic { font-size: 2.4rem; }
    .modal .t { font-family: var(--head); font-size: 1.2rem; font-weight: 500; margin: 6px 0; }
    .modal .d { color: var(--ink-2); font-size: 0.95rem; line-height: 1.6; white-space: pre-line; margin-bottom: 16px; }
    .modal .btns { display: grid; gap: 8px; }

    .loader { display: grid; place-items: center; min-height: 80dvh; text-align: center; }
    .sway { transform-origin: 80px 112px; animation: sway 2.6s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    @media (prefers-reduced-motion: reduce) {
      .wz-content, .pop, .bloom, .spark, .sway, .modal { animation: none !important; }
    }
    @media (max-width: 360px) {
      .garden { grid-template-columns: 108px 1fr; }
      .wz-q { font-size: 1.28rem; }
      .opt .pill { margin-right: 14px; }
    }
  </style>
</head>
<body>
<div class="app">

  <section class="screen active" id="scrLoading">
    <div class="loader">
      <div>
        <div style="width: 150px; margin: 0 auto;" id="loadingPlant"></div>
        <div class="h2" style="margin-top: 8px;">ยาเป๊ะ หุ่นปัง</div>
        <div class="muted">กำลังเตรียมข้อมูลของคุณ...</div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrError">
    <div class="loader">
      <div style="max-width: 320px;">
        <div style="font-size: 3rem;">🌧️</div>
        <div class="h1" id="errTitle" style="font-size: 1.3rem;">เชื่อมต่อไม่สำเร็จ</div>
        <p class="muted" id="errDesc" style="line-height: 1.6;"></p>
        <button class="btn btn-main" onclick="location.reload()">ลองใหม่อีกครั้ง</button>
      </div>
    </div>
  </section>

  <!-- หน้าหลัก -->
  <section class="screen" id="scrHome">
    <div class="debug" id="debugBadge">โหมดทดสอบ (ไม่ได้เชื่อมต่อ LINE)</div>
    <div class="hello">
      <div class="date" id="homeDate"></div>
      <h1 class="h1" id="homeHello">สวัสดีค่ะ</h1>
    </div>
    <div class="notice" id="notice"><div id="noticeText"></div><button type="button" id="noticeBtn" onclick="retrySync()">📤 ส่งอีกครั้ง</button></div>
    <div class="card garden" id="garden"></div>
    <div class="card due" id="dueCard"></div>
    <div class="mini-grid" id="miniGrid"></div>
  </section>

  <!-- น้ำหนัก -->
  <section class="screen" id="scrBody">
    <h1 class="h1" style="margin: 4px 2px 14px;">น้ำหนักของฉัน</h1>
    <div class="tiles" id="bodyTiles"></div>
    <div class="card">
      <div class="row between" style="margin-bottom: 8px;">
        <div class="h2" id="chartTitle">น้ำหนัก (กก.)</div>
        <div class="seg"><button type="button" id="segW" class="on" onclick="setMetric('weight')">น้ำหนัก</button><button type="button" id="segWa" onclick="setMetric('waist')">รอบเอว</button></div>
      </div>
      <div class="chart-wrap" id="bodyChart"></div>
    </div>
    <button class="btn btn-main" style="margin-bottom: 14px;" onclick="startBodyWizard()">⚖️ บันทึกน้ำหนักวันนี้</button>
    <div class="card">
      <div class="h2" style="margin-bottom: 4px;">รายการที่บันทึก</div>
      <div id="bodyList"></div>
    </div>
  </section>

  <!-- ประวัติ -->
  <section class="screen" id="scrHistory">
    <h1 class="h1" style="margin: 4px 2px 14px;">ประวัติการฉีดยา</h1>
    <div id="historyList"></div>
  </section>

  <!-- ฉัน -->
  <section class="screen" id="scrMe">
    <h1 class="h1" style="margin: 4px 2px 14px;">ข้อมูลของฉัน</h1>
    <div class="card" id="meCard"></div>
    <div class="card">
      <div class="h2" style="margin-bottom: 12px;">ตั้งค่า</div>
      <div class="switch">
        <div>
          <div style="font-weight: 500;">แจ้งเตือนวันนัดผ่าน LINE</div>
          <div class="muted">ส่งข้อความเวลา 8:00 น. ของวันนัด</div>
        </div>
        <input type="checkbox" id="setNotify" aria-label="แจ้งเตือนวันนัดผ่าน LINE">
      </div>
      <div class="field"><label for="setPhone">เบอร์โทรศัพท์</label><input class="input" id="setPhone" type="tel" inputmode="tel"></div>
      <div class="field"><label for="setHeight">ส่วนสูง (ซม.) <span class="opt-l">ใช้คำนวณ BMI</span></label><input class="input" id="setHeight" type="number" inputmode="decimal" min="100" max="250" step="0.1"></div>
      <button class="btn btn-main" id="btnSaveSettings" type="button">บันทึกการตั้งค่า</button>
    </div>
    <p class="muted" style="text-align: center;">ศูนย์ดูแลและควบคุมน้ำหนัก รพ.สมิติเวชศรีราชา</p>
  </section>

  <!-- Wizard -->
  <section class="screen" id="scrWizard">
    <div class="wz-head">
      <div class="wz-top">
        <button class="icon-btn" type="button" onclick="wzBack()" aria-label="ย้อนกลับ">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="wz-title" id="wzTitle"></div>
        <button class="icon-btn" type="button" onclick="wzClose()" aria-label="ปิด" id="wzCloseBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="wz-bar" id="wzBar"></div>
    </div>
    <div id="wzBody"></div>
    <div class="wz-foot"><button class="btn btn-main" type="button" id="wzNext" onclick="wzNext()">ถัดไป</button></div>
  </section>

  <!-- ฉลอง -->
  <section class="screen" id="scrDone">
    <div class="done" id="doneBody"></div>
    <div class="wz-foot"><button class="btn btn-main" type="button" onclick="goTab('home')">กลับหน้าหลัก</button></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
    <button class="tab" data-tab="home" onclick="goTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>หน้าหลัก</button>
    <button class="tab" data-tab="body" onclick="goTab('body')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-8"/><path d="M15 7h5v5"/></svg>น้ำหนัก</button>
    <button class="tab" data-tab="history" onclick="goTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>ประวัติ</button>
    <button class="tab" data-tab="me" onclick="goTab('me')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>ฉัน</button>
  </nav>

  <div class="modal-bg" id="modal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="ic" id="mIcon"></div>
      <div class="t" id="mTitle"></div>
      <div class="d" id="mDesc"></div>
      <div class="btns" id="mBtns"></div>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwEW9_vIWqjrhD4dyj09U7dNAVQ72wPvXcFCAUnl3A1-gPvmFjj067y55kpLPLMDycseg/exec";
  const LIFF_ID = "2011178370-3Kbd4Giq";
  const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
  const TH_M = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const TH_D = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
  const EPS = 1e-9;
  const PERMANENT = ["invalid", "not_registered", "invalid_action"];
  const SITES = ["หน้าท้องบนขวา", "หน้าท้องบนซ้าย", "หน้าท้องล่างซ้าย", "หน้าท้องล่างขวา"];
  const BLOOM_AT = 8;

  let uid = "", cfg = null, patient = null;
  let historyCache = null, bodyCache = null;
  let histLoading = false, bodyLoading = false;
  let currentTab = "home", metric = "weight", sending = false;

  // ================== Storage ==================
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  const cacheKey = () => "smu3_state_" + uid;
  const pendingKey = () => "smu3_pending_" + uid;
  function loadCache() { try { const s = JSON.parse(lsGet(cacheKey()) || "null"); return s && s.cfg && s.patient && s.patient.found ? s : null; } catch (e) { return null; } }
  function saveCache() { if (patient && cfg) lsSet(cacheKey(), JSON.stringify({ cfg, patient })); }
  function getPending() { try { return JSON.parse(lsGet(pendingKey()) || "[]"); } catch (e) { return []; } }
  function setPending(list) { lsSet(pendingKey(), JSON.stringify(list)); }
  function removePending(id) { setPending(getPending().filter(r => r.requestId !== id)); }

  // ================== Helpers ==================
  const $ = id => document.getElementById(id);
  function localIso(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function isoUtc(iso) { const p = iso.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function addDaysIso(iso, n) { return new Date(isoUtc(iso) + n * 864e5).toISOString().slice(0, 10); }
  function diffDays(a, b) { return Math.round((isoUtc(a) - isoUtc(b)) / 864e5); }
  function thaiDate(iso) { const p = iso.split("-").map(Number); return `${p[2]} ${TH_M[p[1] - 1]} ${p[0] + 543}`; }
  function thaiShort(iso) { const p = iso.split("-").map(Number); return `${p[2]} ${TH_M[p[1] - 1]}`; }
  function thaiDow(iso) { return "วัน" + TH_D[new Date(isoUtc(iso)).getUTCDay()]; }
  function numKey(n) { return String(Number(n)); }
  function fmtMg(n) { return `${numKey(n)} mg`; }
  function fmt1(n) { return (Math.round(n * 10) / 10).toLocaleString("th-TH", { maximumFractionDigits: 1 }); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function newRequestId() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
  function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }
  function firstName(n) { return String(n || "").replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/, "").split(/\s+/)[0] || ""; }
  const isActive = id => $(id).classList.contains("active");

  // ================== Modal ==================
  function showModal(title, desc, icon = "✅", buttons = [{ label: "ตกลง", primary: true }]) {
    return new Promise(resolve => {
      $("mIcon").innerText = icon; $("mTitle").innerText = title; $("mDesc").innerText = desc;
      const w = $("mBtns"); w.innerHTML = "";
      buttons.forEach((b, i) => {
        const el = document.createElement("button");
        el.type = "button"; el.className = "btn " + (b.primary ? "btn-main" : "btn-ghost"); el.innerText = b.label;
        el.onclick = () => { $("modal").style.display = "none"; resolve(b.value !== undefined ? b.value : i); };
        w.appendChild(el);
      });
      $("modal").style.display = "flex";
    });
  }
  const confirmModal = (t, d, ok = "ยืนยัน", icon = "🧐") => showModal(t, d, icon, [{ label: ok, primary: true, value: true }, { label: "ยกเลิก", value: false }]);

  // ================== หน้าจอ ==================
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
    $("tabbar").classList.toggle("show", ["scrHome", "scrBody", "scrHistory", "scrMe"].includes(id));
    window.scrollTo(0, 0);
  }
  function showError(t, d) { $("errTitle").innerText = t; $("errDesc").innerText = d; showScreen("scrError"); }
  function goTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    if (tab === "home") { showScreen("scrHome"); renderHome(); }
    if (tab === "body") { showScreen("scrBody"); renderBody(); loadBody(); }
    if (tab === "history") { showScreen("scrHistory"); renderHistory(); loadHistory(); }
    if (tab === "me") { showScreen("scrMe"); renderMe(); }
  }

  // ================== API ==================
  async function api(action, payload = {}, timeoutMs = 25000) {
    const body = Object.assign({ action }, payload);
    if (DEBUG) body.testUid = uid; else body.accessToken = liff.getAccessToken();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl.signal });
      const json = await res.json();
      if (json.status !== "success") { const e = new Error(json.message || json.status || "error"); e.code = json.status; throw e; }
      return json;
    } finally { clearTimeout(timer); }
  }
  const isPermanent = e => e && PERMANENT.includes(e.code);

  // ================== ตรรกะปากกา (ต้องตรงกับ Code.gs) ==================
  function medCfg() { return cfg && patient ? cfg.meds.find(m => m.key === patient.medKey) : null; }
  function clicksFor(m, doseMg, penMg) {
    const ov = m.overrides ? m.overrides[`${numKey(penMg)}|${numKey(doseMg)}`] : undefined;
    let c;
    if (ov !== undefined && ov !== null) c = Number(ov);
    else if (Math.abs(doseMg - penMg) < EPS) c = m.clicksPerFullDose;
    else c = Math.round((doseMg / penMg) * m.clicksPerFullDose);
    return Math.min(m.clicksPerFullDose, Math.max(1, c));
  }
  function instructionText(m, doseMg, penMg) {
    if (Math.abs(doseMg - penMg) < EPS) return m.fullDoseText.replace("{mg}", fmtMg(penMg));
    return `หมุน ${clicksFor(m, doseMg, penMg)} คลิก`;
  }
  function penOptions(m, penMg) {
    return m.doses.filter(d => d <= penMg + EPS).sort((a, b) => b - a).map(d => ({ mg: d, clicks: clicksFor(m, d, penMg), full: Math.abs(d - penMg) < EPS }));
  }
  const capacity = m => cfg.dosesPerPen * m.clicksPerFullDose;
  const isValidPenMg = (m, mg) => m.doses.some(d => Math.abs(d - mg) < EPS);

  function penState(p) {
    const m = medCfg();
    if (!p.lastPenNumber || !p.lastDoseNumber) return { status: "fresh" };
    const penMg = Number(p.penStrength);
    if (!penMg || !isValidPenMg(m, penMg)) return { status: "mustNew", reason: "ขนาดปากกาเดิมไม่ตรงกับยาปัจจุบัน จึงเริ่มด้ามใหม่ให้ค่ะ" };
    if (p.penSpecialUsed) return { status: "mustNew", reason: `ด้ามที่ ${p.lastPenNumber} ใช้ครั้งพิเศษไปแล้ว จึงเริ่มด้ามใหม่ให้ค่ะ` };
    const remaining = capacity(m) - (Number(p.penUsedClicks) || 0);
    const fits = penOptions(m, penMg).filter(o => o.clicks <= remaining);
    return fits.length ? { status: "continue", penMg, remaining } : { status: "full", penMg };
  }
  function defaultPenMg(m) {
    for (const c of [patient.penStrength, patient.currentDose].map(Number)) if (c && isValidPenMg(m, c)) return c;
    return null;
  }
  function buildDraft(forceNew) {
    const st = penState(patient);
    const base = { penNumber: patient.lastPenNumber, doseNumber: patient.lastDoseNumber + 1, penMg: st.penMg,
      usedClicks: Number(patient.penUsedClicks) || 0, isNewPen: false, isSpecial: false };
    if (!forceNew && st.status === "continue") return Object.assign(base, { mode: "continue" });
    if (!forceNew && st.status === "full") return Object.assign(base, { mode: "full" });
    return { mode: "new", penNumber: (patient.lastPenNumber || 0) + 1, doseNumber: 1, penMg: defaultPenMg(medCfg()),
      usedClicks: 0, isNewPen: true, isSpecial: false, canReturn: st.status === "continue" || st.status === "full",
      reason: forceNew ? "" : (st.reason || "") };
  }
  function applyRecord(p, rec) {
    const q = Object.assign({}, p);
    if (rec.penNumber > (q.lastPenNumber || 0)) {
      Object.assign(q, { lastPenNumber: rec.penNumber, lastDoseNumber: rec.doseNumber, penUsedClicks: rec.isSpecial ? 0 : rec.clicks,
        penSpecialUsed: !!rec.isSpecial, penStrength: rec.penStrengthMg });
    } else if (rec.penNumber === q.lastPenNumber) {
      q.lastDoseNumber = Math.max(q.lastDoseNumber || 0, rec.doseNumber);
      if (rec.isSpecial) q.penSpecialUsed = true; else q.penUsedClicks = (Number(q.penUsedClicks) || 0) + rec.clicks;
      q.penStrength = rec.penStrengthMg;
    }
    if (!q.lastInjectedDate || rec.actualDate >= q.lastInjectedDate) {
      Object.assign(q, { lastInjectedDate: rec.actualDate, lastInjectedSite: rec.site, intervalDays: rec.intervalDays, currentDose: rec.doseMg });
    }
    q.nextDueDate = q.lastInjectedDate ? addDaysIso(q.lastInjectedDate, q.intervalDays || 7) : "";
    return q;
  }
  function reapplyPending(sp) { return getPending().filter(r => r.kind === "injection").reduce((a, r) => applyRecord(a, r.payload), sp); }

  // ================== ต้นปัง (มาสคอต) ==================
  // n = จำนวนเข็มที่บันทึก: ใบงอกเพิ่มทีละใบ ครบ 8 เข็มออกดอก
  function plantSVG(n, opts = {}) {
    const grow = !!opts.grow, sway = !!opts.sway;
    const leaves = Math.min(n, 12);
    const stemH = n === 0 ? 0 : 22 + Math.min(n, 12) * 6.5;
    const top = 112 - stemH;
    let g = "";
    if (n === 0) {
      g += `<ellipse cx="80" cy="108" rx="7" ry="5" fill="#9C6B43"/><path d="M80 104 q2 -8 7 -10" stroke="#2E9A5B" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    } else {
      g += `<path d="M80 112 C 76 ${112 - stemH * 0.35}, 85 ${112 - stemH * 0.7}, 80 ${top}" stroke="#2E9A5B" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
      for (let i = 0; i < leaves; i++) {
        const t = (i + 1) / (leaves + 1);
        const y = 112 - 10 - t * (stemH - 16);
        const left = i % 2 === 0;
        const sc = 0.75 + (1 - t) * 0.45;
        const isNew = grow && i === leaves - 1 && n <= 12;
        const fill = ["#3FAE6A", "#2E9A5B", "#56C27E"][i % 3];
        g += `<g transform="translate(80 ${y}) rotate(${left ? 200 : -20}) scale(${sc})"><g class="${isNew ? "pop" : ""}"><path d="M0 0 C 8 -11, 26 -11, 32 0 C 26 9, 8 9, 0 0 Z" fill="${fill}"/><path d="M3 0 H 26" stroke="rgba(255,255,255,0.45)" stroke-width="1.4"/></g></g>`;
      }
      if (n >= BLOOM_AT) {
        g += `<g transform="translate(80 ${top - 6})"><g class="${grow && n === BLOOM_AT ? "bloom" : ""}">${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-9" rx="6.5" ry="9" fill="#FFC845" transform="rotate(${a})"/>`).join("")}<circle r="6" fill="#F08A3C"/></g></g>`;
      } else {
        g += `<g transform="translate(80 ${top})"><path d="M0 0 C -4 -10, -14 -12, -16 -6 C -12 -2, -5 -1, 0 0 Z" fill="#56C27E"/><path d="M0 0 C 4 -10, 14 -12, 16 -6 C 12 -2, 5 -1, 0 0 Z" fill="#3FAE6A"/></g>`;
      }
    }
    const sparks = grow ? `<g fill="#FFC845"><path class="spark" d="M30 50 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3z"/><path class="spark" style="animation-delay:.75s" d="M128 36 l2 -6 2 6 6 2 -6 2 -2 6 -2 -6 -6 -2z"/><circle class="spark" style="animation-delay:.6s" cx="124" cy="78" r="4"/></g>` : "";
    return `<svg viewBox="0 0 160 170" width="100%" role="img" aria-label="ต้นปัง ${n} ใบ">${sparks}
      <g class="${sway ? "sway" : ""}">${g}</g>
      <ellipse cx="80" cy="113" rx="40" ry="7" fill="#7A5638"/>
      <path d="M38 112 H122 L112 162 Q111 167 106 167 H54 Q49 167 48 162 Z" fill="#F4D7A4"/>
      <rect x="33" y="104" width="94" height="16" rx="8" fill="#EBC283"/>
      <circle cx="66" cy="138" r="3.6" fill="#16362A"/><circle cx="94" cy="138" r="3.6" fill="#16362A"/>
      <path d="M74 146 Q80 152 86 146" stroke="#16362A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="57" cy="147" rx="6" ry="3.5" fill="#F4A69C" opacity="0.7"/><ellipse cx="103" cy="147" rx="6" ry="3.5" fill="#F4A69C" opacity="0.7"/>
    </svg>`;
  }

  // แถบยา 4 โดส: เขียว = ใช้ไปแล้ว, เหลือง = รอบนี้
  function doseBar(used, add = 0, big = false) {
    let h = `<div class="doses ${big ? "big" : ""}" aria-hidden="true">`;
    for (let i = 0; i < 4; i++) {
      const u = Math.max(0, Math.min(1, used - i));
      const a = Math.max(0, Math.min(1 - u, used + add - i - u));
      h += `<div class="dose-cap"><i style="width:${u * 100}%"></i><b style="left:${u * 100}%;width:${a * 100}%"></b></div>`;
    }
    return h + "</div>";
  }

  // จำนวนเข็มทั้งหมด และการฉีดตรงนัดติดต่อกัน
  function injStats() {
    const pend = getPending().filter(p => p.kind === "injection").map(p => ({ date: p.payload.actualDate, interval: p.payload.intervalDays }));
    const all = (historyCache || []).map(e => ({ date: e.date, interval: e.interval || 7 })).concat(pend).filter(e => e.date)
      .sort((a, b) => a.date > b.date ? 1 : a.date < b.date ? -1 : 0);
    let streak = all.length ? 1 : 0;
    for (let i = all.length - 1; i > 0; i--) {
      if (diffDays(all[i].date, all[i - 1].date) <= (all[i - 1].interval || 7) + 1) streak++; else break;
    }
    return { total: all.length, streak };
  }

  // ================== หน้าหลัก ==================
  function renderHome() {
    if (!patient) return;
    const h = new Date().getHours();
    const greet = h < 12 ? "สวัสดีตอนเช้า" : h < 17 ? "สวัสดีตอนบ่าย" : "สวัสดีตอนเย็น";
    $("homeDate").innerText = `${thaiDow(localIso())}ที่ ${thaiDate(localIso())}`;
    $("homeHello").innerText = `${greet} คุณ${firstName(patient.name)}`;
    renderNotice();

    const st = historyCache ? injStats() : null;
    const n = st ? st.total : 0;
    $("garden").innerHTML = `
      <div>${plantSVG(n, { sway: true })}</div>
      <div style="padding-bottom: 10px;">
        <div class="muted">ต้นปังของคุณ</div>
        <div class="count">${st ? st.total : "–"} <small>เข็ม</small></div>
        <div class="muted small">${!st ? "กำลังโหลด..." : n === 0 ? "บันทึกเข็มแรก แล้วต้นปังจะเริ่มงอก" : n < BLOOM_AT ? `อีก ${BLOOM_AT - n} เข็ม ต้นปังจะออกดอก 🌼` : "ต้นปังออกดอกแล้ว เก่งมาก!"}</div>
        ${st && st.streak >= 2 ? `<div class="streak">🔥 ฉีดตรงนัดติดกัน ${st.streak} ครั้ง</div>` : ""}
      </div>`;

    const due = $("dueCard"), interval = patient.intervalDays || 7;
    const btn = (cls, txt) => `<button class="btn ${cls}" style="grid-column: 1 / -1;" onclick="startInjectWizard()">${txt}</button>`;
    if (!patient.lastInjectedDate) {
      due.className = "card due";
      due.innerHTML = `${ring(0, 1, "🌱")}<div><div class="due-title">พร้อมเริ่มเข็มแรกแล้ว</div><div class="muted small">ฉีดเสร็จแล้วกดบันทึกได้เลยค่ะ</div></div>${btn("btn-main", "💉 บันทึกการฉีดยา")}`;
    } else {
      const next = addDaysIso(patient.lastInjectedDate, interval);
      const d = diffDays(localIso(), next);
      if (d === 0) {
        due.className = "card due today";
        due.innerHTML = `${ring(1, 1, "💉", "#E8A817")}<div><div class="due-title">วันนี้ถึงคิวฉีดแล้ว</div><div class="muted small">ฉีดเสร็จแล้วอย่าลืมบันทึกนะคะ</div></div>${btn("btn-sun", "💉 บันทึกการฉีดวันนี้")}`;
      } else if (d > 0) {
        due.className = "card due over";
        due.innerHTML = `${ring(1, 1, "⏰", "#E0614F")}<div><div class="due-title">เลยนัดมา ${d} วัน</div><div class="muted small">นัดเดิม ${thaiDate(next)} หากยังไม่ได้ฉีด กรุณาสอบถามเจ้าหน้าที่ก่อนฉีดค่ะ</div></div>${btn("btn-main", "💉 บันทึกการฉีดยา")}`;
      } else {
        due.className = "card due";
        due.innerHTML = `${ring(interval + d, interval, String(-d))}<div><div class="due-title">อีก ${-d} วันถึงคิวฉีด</div><div class="muted small">${thaiDow(next)}ที่ ${thaiDate(next)}</div></div>${btn("btn-soft", "💉 บันทึกการฉีดยา")}`;
      }
    }

    const m = medCfg(), ps = m ? penState(patient) : { status: "fresh" };
    let penHtml;
    if (!m || ps.status === "fresh") penHtml = `<div class="lbl">ปากกา</div><div class="val">ด้ามแรก</div><div class="muted small">เริ่มนับเมื่อบันทึกเข็มแรก</div>`;
    else {
      const used = (Number(patient.penUsedClicks) || 0) / m.clicksPerFullDose;
      const changeNow = ps.status === "full" || ps.status === "mustNew";
      penHtml = `<div class="lbl">ปากกาด้ามที่ ${patient.lastPenNumber}</div><div class="val">${changeNow ? "ครบแล้ว" : `${fmt1(Math.max(0, cfg.dosesPerPen - used))} <small>โดสเหลือ</small>`}</div>${doseBar(used)}
        <div class="muted small">${changeNow ? "รอบหน้าเริ่มด้ามใหม่" : `ด้าม ${fmtMg(patient.penStrength)}`}</div>`;
    }
    const ws = bodyEntries().filter(e => e.weight), lw = ws[ws.length - 1], fw = ws[0];
    let wHtml = `<div class="lbl">น้ำหนัก</div>`;
    if (!lw) wHtml += `<div class="val">–</div><div class="muted small">แตะเพื่อบันทึก ⚖️</div>`;
    else {
      const diff = lw.weight - fw.weight;
      wHtml += `<div class="val">${fmt1(lw.weight)} <small>กก.</small></div><div class="muted small">${ws.length > 1 ? (diff < -0.05 ? `ลดไปแล้ว ${fmt1(-diff)} กก. 🎉` : diff > 0.05 ? `+${fmt1(diff)} กก. จากครั้งแรก` : "เท่ากับครั้งแรก") : "แตะเพื่อบันทึกเพิ่ม"}</div>`;
    }
    $("miniGrid").innerHTML = `<button class="mini" onclick="goTab('history')">${penHtml}</button><button class="mini" onclick="startBodyWizard()">${wHtml}</button>`;

    if (!historyCache) loadHistory(true);
    if (!bodyCache) loadBody(true);
  }

  function ring(v, max, label, color = "#2E9A5B") {
    const r = 30, c = 2 * Math.PI * r, p = max ? Math.max(0, Math.min(1, v / max)) : 0;
    const num = /^\d+$/.test(label);
    return `<svg viewBox="0 0 74 74" width="74" height="74" aria-hidden="true"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#E2EFE6" stroke-width="8"/>
      <circle cx="37" cy="37" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 37 37)"/>
      <text x="37" y="${num ? 45 : 46}" text-anchor="middle" font-family="Mitr, sans-serif" font-size="${num ? 24 : 24}" fill="#16362A">${label}</text></svg>`;
  }

  function renderNotice(msg) {
    const c = getPending().length;
    if (c > 0) { $("notice").style.display = "block"; $("noticeText").innerHTML = `⏳ มี <b>${c} รายการ</b> เก็บไว้ในเครื่อง ยังไม่ได้ส่งเข้าระบบ กรุณาอย่าบันทึกซ้ำนะคะ`; }
    else if (msg) { $("notice").style.display = "block"; $("noticeText").innerText = msg; }
    else $("notice").style.display = "none";
  }

  // ================== Wizard (กรอกทีละขั้น) ==================
  const WZ = { c: null, i: 0, busy: false };
  function startWizard(c) {
    WZ.c = c; WZ.i = 0; WZ.busy = false; c.state = c.state || {};
    showScreen("scrWizard");
    $("wzCloseBtn").style.visibility = c.noClose ? "hidden" : "visible";
    renderStep(1);
  }
  function renderStep(dir) {
    const c = WZ.c, s = c.steps[WZ.i];
    $("wzTitle").innerText = c.title;
    $("wzBar").innerHTML = c.steps.map((_, i) => `<span class="${i <= WZ.i ? "on" : ""}"></span>`).join("");
    $("wzBody").innerHTML = `<div class="wz-content ${dir < 0 ? "back" : ""}"><div class="wz-q">${s.q}</div>${s.sub ? `<div class="wz-sub">${s.sub}</div>` : `<div class="wz-gap"></div>`}<div id="wzStep"></div></div>`;
    s.render($("wzStep"), c.state);
    wzRefresh();
    window.scrollTo(0, 0);
  }
  function wzRefresh() {
    const c = WZ.c, s = c.steps[WZ.i], last = WZ.i === c.steps.length - 1;
    const ok = s.valid ? s.valid(c.state) : true;
    const b = $("wzNext");
    b.disabled = !ok || WZ.busy;
    if (!WZ.busy) b.innerText = (typeof s.next === "function" ? s.next(c.state) : s.next) || (last ? "บันทึก" : "ถัดไป");
  }
  function rerenderStep() { const c = WZ.c; c.steps[WZ.i].render($("wzStep"), c.state); wzRefresh(); }
  async function wzNext() {
    const c = WZ.c, s = c.steps[WZ.i];
    if (WZ.busy || (s.valid && !s.valid(c.state))) return;
    if (s.beforeNext && (await s.beforeNext(c.state)) === false) return;
    if (WZ.i === c.steps.length - 1) {
      WZ.busy = true; $("wzNext").disabled = true; $("wzNext").innerText = "กำลังบันทึก...";
      try { await c.onFinish(c.state); } finally { WZ.busy = false; if (isActive("scrWizard")) wzRefresh(); }
      return;
    }
    WZ.i++; renderStep(1);
  }
  function wzBack() { if (WZ.busy) return; if (WZ.i === 0) return wzClose(); WZ.i--; renderStep(-1); }
  function wzGo(i) { WZ.i = i; renderStep(-1); }
  async function wzClose() {
    if (WZ.busy || WZ.c.noClose) return;
    if (WZ.i > 0 && !(await confirmModal("ออกจากการบันทึก?", "ข้อมูลที่กรอกไว้รอบนี้จะไม่ถูกบันทึก", "ออก", "🚪"))) return;
    goTab(currentTab);
  }
  function press(el, sel, btn) { el.querySelectorAll(sel).forEach(b => b.setAttribute("aria-pressed", "false")); btn.setAttribute("aria-pressed", "true"); }

  // ================== Wizard: บันทึกการฉีด ==================
  function startInjectWizard() {
    if (!medCfg()) { showModal("ไม่พบข้อมูลชนิดยา", "กรุณาติดต่อเจ้าหน้าที่ศูนย์ฯ ค่ะ", "⚠️"); return; }
    const iv = String(patient.intervalDays || 7), std = ["7", "10", "14"].includes(iv);
    const state = {
      draft: buildDraft(false), doseMg: null, dateMode: "today", date: localIso(),
      interval: std ? iv : "custom", customDays: std ? "" : iv,
      site: suggestSite(), sides: new Set([cfg.sideEffects.findIndex(s => s.none)])
    };
    startWizard({ title: "บันทึกการฉีดยา", state, steps: [STEP_PEN, STEP_DOSE, STEP_WHEN, STEP_SITE, STEP_SIDE, STEP_SUM], onFinish: submitInjection });
  }
  function suggestSite() { const i = SITES.indexOf((patient.lastInjectedSite || "").trim()); return i === -1 ? SITES[0] : SITES[(i + 1) % SITES.length]; }
  function intervalOf(st) { return st.interval === "custom" ? parseInt(st.customDays, 10) : parseInt(st.interval, 10); }
  function dateFloor(st) {
    const floor = addDaysIso(localIso(), -(cfg.maxBackdateDays || 180));
    return (!st.draft.isNewPen && patient.lastInjectedDate && patient.lastInjectedDate > floor) ? patient.lastInjectedDate : floor;
  }

  const STEP_PEN = {
    q: "ฉีดจากปากกาด้ามไหนคะ?",
    sub: "ระบบนับลำดับด้ามและครั้งที่ให้อัตโนมัติ",
    render(el, st) {
      const d = st.draft, m = medCfg();
      if (d.mode === "full" && !d.isSpecial) {
        el.innerHTML = `<div class="box-info">ด้ามที่ ${d.penNumber} ใช้ครบ ${cfg.dosesPerPen} โดสเต็มแล้ว 🎉 รอบนี้ฉีดจากปากกาแบบไหนคะ</div>
          <div class="opts">
            <button type="button" class="opt" id="optNew"><span class="emoji">🖊️</span><span><div class="t">เริ่มปากกาด้ามใหม่</div><div class="s">ด้ามที่ ${d.penNumber + 1} ครั้งที่ 1</div></span></button>
            <button type="button" class="opt special" id="optSp"><span class="emoji" style="background: var(--sun-soft);">⭐</span><span><div class="t">ครั้งพิเศษ (ยาคงเหลือ)</div><div class="s">ยาที่เหลือในด้ามที่ ${d.penNumber} ฉีดโดยพยาบาลที่ รพ.</div></span></button>
          </div>`;
        el.querySelector("#optNew").onclick = () => { st.draft = buildDraft(true); st.doseMg = null; rerenderStep(); };
        el.querySelector("#optSp").onclick = () => { d.isSpecial = true; st.doseMg = null; rerenderStep(); };
        return;
      }
      const used = d.usedClicks / m.clicksPerFullDose;
      let h = `<div class="pen-card">
          <div class="row between"><div><div class="muted">${d.isNewPen ? "ปากกาด้ามใหม่" : "ปากกาที่ใช้อยู่"}</div><div class="pen-num">ด้ามที่ ${d.penNumber}</div></div>
          <span class="chip-round ${d.isSpecial ? "special" : ""}">ครั้งที่ ${d.doseNumber}${d.isSpecial ? " ⭐" : ""}</span></div>
          ${d.isNewPen ? "" : `${doseBar(used, 0, true)}<div class="muted small">ใช้ไปแล้ว ${fmt1(used)} จาก ${cfg.dosesPerPen} โดสเต็ม · ด้าม ${fmtMg(d.penMg)}</div>`}
        </div>`;
      if (d.reason) h += `<div class="box-info">${esc(d.reason)}</div>`;
      if (d.isSpecial) {
        h += `<div class="box-warn"><b>⚠️ ครั้งพิเศษ (ยาคงเหลือในแท่ง)</b><br>ต้องได้รับอนุญาตจากแพทย์ และให้พยาบาลเป็นผู้ดูดยาและฉีดที่โรงพยาบาลเท่านั้นค่ะ</div>
          <button type="button" class="link" id="lnkBack">เปลี่ยนตัวเลือก</button>`;
      } else if (d.isNewPen) {
        h += `<div class="field"><label>ขนาดปากกาตามหน้ากล่อง</label><div class="opts three">${m.doses.map(mg =>
          `<button type="button" class="opt center" data-mg="${mg}" aria-pressed="${!!d.penMg && Math.abs(d.penMg - mg) < EPS}"><span class="t">${numKey(mg)}</span><span class="s">mg</span></button>`).join("")}</div></div>`;
        if (d.canReturn) h += `<button type="button" class="link" id="lnkReturn">กลับไปใช้ด้ามที่ ${patient.lastPenNumber}</button>`;
      } else {
        h += `<div class="box-info">✅ ถ้ายังใช้ปากกาแท่งเดิม กดถัดไปได้เลยค่ะ</div><button type="button" class="link" id="lnkNew">เปลี่ยนเป็นปากกาด้ามใหม่</button>`;
      }
      el.innerHTML = h;
      el.querySelectorAll("[data-mg]").forEach(b => b.onclick = () => { d.penMg = Number(b.dataset.mg); st.doseMg = null; press(el, "[data-mg]", b); wzRefresh(); });
      const on = (id, fn) => { const x = el.querySelector(id); if (x) x.onclick = fn; };
      on("#lnkBack", () => { st.draft = buildDraft(false); st.doseMg = null; rerenderStep(); });
      on("#lnkReturn", () => { st.draft = buildDraft(false); st.doseMg = null; rerenderStep(); });
      on("#lnkNew", async () => {
        if (await confirmModal("เริ่มปากกาด้ามใหม่?", `ระบบจะนับเป็นด้ามที่ ${d.penNumber + 1} ครั้งที่ 1\nใช้เมื่อเปลี่ยนเป็นปากกาแท่งใหม่จริงเท่านั้นนะคะ`, "เริ่มด้ามใหม่", "🖊️")) {
          st.draft = buildDraft(true); st.doseMg = null; rerenderStep();
        }
      });
    },
    valid: st => !!st.draft.penMg && !(st.draft.mode === "full" && !st.draft.isSpecial)
  };

  const STEP_DOSE = {
    q: "รอบนี้ฉีดขนาดเท่าไหร่คะ?",
    sub: "เลือกตามที่แพทย์สั่ง ระบบจะบอกวิธีหมุนปากกาให้",
    render(el, st) {
      const d = st.draft, m = medCfg();
      let list = penOptions(m, d.penMg);
      if (!d.isNewPen && !d.isSpecial) list = list.filter(o => o.clicks <= capacity(m) - d.usedClicks);
      if (st.doseMg === null || !list.some(o => Math.abs(o.mg - st.doseMg) < EPS)) {
        const hit = list.find(o => Math.abs(o.mg - Number(patient.currentDose)) < EPS);
        st.doseMg = hit ? hit.mg : (list.length === 1 ? list[0].mg : null);
      }
      el.innerHTML = `<div class="opts">${list.map(o => `
          <button type="button" class="opt" data-dose="${o.mg}" aria-pressed="${st.doseMg !== null && Math.abs(st.doseMg - o.mg) < EPS}">
            <span><div class="t">${fmtMg(o.mg)}</div><div class="s">${o.full ? "ฉีดเต็มโดส" : "แบ่งฉีด"}</div></span>
            <span class="pill">${esc(instructionText(m, o.mg, d.penMg))}</span></button>`).join("")}</div><div id="doseAfter"></div>`;
      const after = () => {
        const box = el.querySelector("#doseAfter");
        if (st.doseMg === null) { box.innerHTML = ""; return; }
        if (d.isSpecial) { box.innerHTML = `<div class="box-warn">หลังครั้งพิเศษนี้ รอบถัดไปจะเริ่มปากกาด้ามใหม่</div>`; return; }
        const used = d.usedClicks / m.clicksPerFullDose, add = clicksFor(m, st.doseMg, d.penMg) / m.clicksPerFullDose;
        box.innerHTML = `<div class="card" style="margin-top: 14px;"><div class="muted small">หลังฉีดรอบนี้</div>${doseBar(used, add, true)}
          <div class="small">ด้ามนี้จะเหลือ <b>${fmt1(Math.max(0, cfg.dosesPerPen - used - add))}</b> โดสเต็ม <span class="muted">(สีเหลือง = รอบนี้)</span></div></div>`;
      };
      el.querySelectorAll("[data-dose]").forEach(b => b.onclick = () => { st.doseMg = Number(b.dataset.dose); press(el, "[data-dose]", b); after(); wzRefresh(); });
      after();
    },
    valid: st => st.doseMg !== null
  };

  const STEP_WHEN = {
    q: "ฉีดวันไหน และอีกกี่วันฉีดครั้งต่อไปคะ?",
    render(el, st) {
      const today = localIso();
      el.innerHTML = `
        <div class="opts two">
          <button type="button" class="opt center" data-dm="today" aria-pressed="${st.dateMode === "today"}"><span class="t">ฉีดวันนี้</span><span class="s">${thaiShort(today)}</span></button>
          <button type="button" class="opt center" data-dm="other" aria-pressed="${st.dateMode === "other"}"><span class="t">วันอื่น</span><span class="s">บันทึกย้อนหลัง</span></button>
        </div>
        <div class="field" id="dateWrap" style="margin-top: 12px; display: ${st.dateMode === "other" ? "block" : "none"};">
          <label for="wDate">วันที่ฉีดจริง</label><input class="input" type="date" id="wDate" value="${st.date}" min="${dateFloor(st)}" max="${today}">
        </div>
        <div class="field" style="margin-top: 18px;"><label>ระยะห่างถึงเข็มถัดไป (ตามแพทย์สั่ง)</label>
          <div class="opts four">${["7", "10", "14", "custom"].map(v =>
            `<button type="button" class="opt center" data-iv="${v}" aria-pressed="${st.interval === v}"><span class="t">${v === "custom" ? "อื่นๆ" : v}</span><span class="s">${v === "custom" ? "ระบุเอง" : "วัน"}</span></button>`).join("")}</div>
        </div>
        <div class="field" id="customWrap" style="display: ${st.interval === "custom" ? "block" : "none"};">
          <input class="input" type="number" id="wCustom" min="1" max="60" inputmode="numeric" placeholder="จำนวนวัน 1-60" value="${esc(st.customDays)}" aria-label="จำนวนวัน">
        </div>
        <div id="nextPreview"></div>`;
      const preview = () => {
        const iv = intervalOf(st), ok = st.date && iv >= 1 && iv <= 60;
        el.querySelector("#nextPreview").innerHTML = ok ? `<div class="box-info">🗓️ นัดครั้งถัดไป: <b>${thaiDow(addDaysIso(st.date, iv))}ที่ ${thaiDate(addDaysIso(st.date, iv))}</b></div>` : "";
      };
      el.querySelectorAll("[data-dm]").forEach(b => b.onclick = () => {
        st.dateMode = b.dataset.dm; press(el, "[data-dm]", b);
        el.querySelector("#dateWrap").style.display = st.dateMode === "other" ? "block" : "none";
        if (st.dateMode === "today") { st.date = today; el.querySelector("#wDate").value = today; }
        preview(); wzRefresh();
      });
      el.querySelector("#wDate").onchange = e => { st.date = e.target.value; preview(); wzRefresh(); };
      el.querySelectorAll("[data-iv]").forEach(b => b.onclick = () => {
        st.interval = b.dataset.iv; press(el, "[data-iv]", b);
        el.querySelector("#customWrap").style.display = st.interval === "custom" ? "block" : "none";
        preview(); wzRefresh();
      });
      el.querySelector("#wCustom").oninput = e => { st.customDays = e.target.value; preview(); wzRefresh(); };
      preview();
    },
    valid(st) { const iv = intervalOf(st); return !!st.date && st.date <= localIso() && st.date >= dateFloor(st) && iv >= 1 && iv <= 60; },
    async beforeNext(st) {
      if (!patient.lastInjectedDate) return true;
      const gap = diffDays(st.date, patient.lastInjectedDate);
      if (Math.abs(gap) >= 4) return true;
      return await confirmModal("ตรวจสอบก่อนไปต่อ",
        `มีการบันทึกการฉีดล่าสุดเมื่อ ${thaiDate(patient.lastInjectedDate)}${gap === 0 ? " (วันเดียวกัน)" : ` (ห่าง ${Math.abs(gap)} วัน)`}\n\nยืนยันว่าเป็นการฉีดยาเข็มใหม่ ไม่ใช่การบันทึกซ้ำใช่ไหมคะ?`, "ใช่ เป็นเข็มใหม่");
    }
  };

  const STEP_SITE = {
    q: "ฉีดตรงไหนของหน้าท้องคะ?",
    sub: "สลับตำแหน่งทุกครั้ง ช่วยลดก้อนไขมันใต้ผิวหนัง",
    render(el, st) {
      const sug = suggestSite(), last = (patient.lastInjectedSite || "").trim();
      const q = [["หน้าท้องบนขวา", 38, 30, "บนขวา"], ["หน้าท้องบนซ้าย", 146, 30, "บนซ้าย"], ["หน้าท้องล่างขวา", 38, 118, "ล่างขวา"], ["หน้าท้องล่างซ้าย", 146, 118, "ล่างซ้าย"]];
      el.innerHTML = `<div class="belly"><svg viewBox="0 0 280 226" width="100%" style="max-width: 300px;" role="group" aria-label="เลือกตำแหน่งฉีด">
          <path d="M 30,24 C 65,14 215,14 250,24 C 266,84 266,148 250,204 C 215,218 65,218 30,204 C 14,148 14,84 30,24 Z" fill="#FBF3EC" stroke="#EADBCD" stroke-width="2"/>
          ${q.map(([s, x, y, l]) => `<g data-pick="${s}" style="cursor: pointer;" role="button" aria-label="${s}"><rect class="quad ${st.site === s ? "on" : ""}" data-site="${s}" x="${x}" y="${y}" width="96" height="78" rx="18"/>
            <text class="qlabel" x="${x + 48}" y="${y + 40}" text-anchor="middle">${l}</text>
            ${s === sug ? `<text x="${x + 48}" y="${y + 62}" text-anchor="middle" font-size="12" fill="#0B5C36" font-family="Prompt, sans-serif">✨ แนะนำ</text>` : ""}
            ${s === last ? `<text x="${x + 48}" y="${y + 62}" text-anchor="middle" font-size="12" fill="#8A5A00" font-family="Prompt, sans-serif">ครั้งก่อน</text>` : ""}</g>`).join("")}
          <circle cx="140" cy="113" r="8" fill="#D9B79A"/><circle cx="140" cy="113" r="3" fill="#A07A5C"/>
        </svg><div class="h2" style="color: var(--forest); margin-top: 6px;" id="siteName">${st.site}</div></div><div id="siteWarn"></div>`;
      const warn = () => el.querySelector("#siteWarn").innerHTML = st.site === last ? `<div class="box-warn">ตำแหน่งนี้ฉีดไปเมื่อครั้งก่อน แนะนำสลับไปตำแหน่งอื่นค่ะ</div>` : "";
      el.querySelectorAll("[data-pick]").forEach(g => g.addEventListener("click", () => {
        st.site = g.dataset.pick;
        el.querySelectorAll(".quad").forEach(r => r.classList.toggle("on", r.dataset.site === st.site));
        el.querySelector("#siteName").innerText = st.site; warn(); wzRefresh();
      }));
      warn();
    },
    valid: st => !!st.site
  };

  const hasRed = st => [...st.sides].some(i => cfg.sideEffects[i] && cfg.sideEffects[i].redFlag);

    sub: "เลือกได้หลายข้อ ข้อมูลนี้ช่วยให้ทีมดูแลคุณได้ดีขึ้น",
    render(el, st) {
      el.innerHTML = `<div class="chips">${cfg.sideEffects.map((s, i) =>
        `<button type="button" class="chip ${s.redFlag ? "red" : ""}" data-i="${i}" aria-pressed="${st.sides.has(i)}">${s.redFlag ? "⚠️ " : ""}${esc(s.label)}</button>`).join("")}</div><div id="redBox"></div>`;
      const noneIdx = cfg.sideEffects.findIndex(x => x.none);
      const sync = () => {
        el.querySelectorAll("[data-i]").forEach(c => c.setAttribute("aria-pressed", st.sides.has(Number(c.dataset.i))));
        el.querySelector("#redBox").innerHTML = hasRed(st) ? `<div class="box-red"><b>⚠️ อาการที่ต้องเฝ้าระวัง</b><br>กรุณาติดต่อโรงพยาบาลโดยเร็ว${cfg.hospitalContact ? ` (${esc(cfg.hospitalContact)})` : ""}<br>หากอาการรุนแรง เช่น หายใจลำบาก ให้ไปห้องฉุกเฉินหรือโทร 1669 ทันที</div>` : "";
      };
      el.querySelectorAll("[data-i]").forEach(c => c.onclick = () => {
        const i = Number(c.dataset.i);
        if (cfg.sideEffects[i].none) st.sides = new Set([i]);
        else { st.sides.delete(noneIdx); st.sides.has(i) ? st.sides.delete(i) : st.sides.add(i); if (!st.sides.size) st.sides.add(noneIdx); }
        sync(); wzRefresh();
      });
      sync();
    },
    valid: st => st.sides.size > 0
  };

  const STEP_SUM = {
    q: "ตรวจสอบก่อนบันทึกนะคะ",
    sub: "แตะ \"แก้ไข\" เพื่อกลับไปเปลี่ยนข้อมูลได้",
    next: "ยืนยันบันทึก ✓",
    render(el, st) {
      const d = st.draft, m = medCfg(), iv = intervalOf(st);
      const rows = [
        ["🖊️", "ปากกา", `ด้ามที่ ${d.penNumber} · ครั้งที่ ${d.doseNumber}${d.isSpecial ? " ⭐ ครั้งพิเศษ" : ""}<br><span class="muted small">ด้าม ${fmtMg(d.penMg)}</span>`, 0],
        ["💉", "ขนาดยา", `${fmtMg(st.doseMg)}<br><span class="muted small">${esc(instructionText(m, st.doseMg, d.penMg))}</span>`, 1],
        ["🗓️", "วันที่ฉีด", `${thaiDow(st.date)}ที่ ${thaiDate(st.date)}<br><span class="muted small">นัดถัดไป ${thaiDate(addDaysIso(st.date, iv))} (ทุก ${iv} วัน)</span>`, 2],
        ["📍", "ตำแหน่ง", esc(st.site), 3],
        ["🩺", "อาการ", esc(sideText(st)), 4]

      el.innerHTML = `<div class="card">${rows.map(([ic, k, v, i]) => `<div class="sum-row"><div class="sum-ic">${ic}</div><div class="grow"><div class="k">${k}</div><div class="v">${v}</div></div><button type="button" class="edit" onclick="wzGo(${i})">แก้ไข</button></div>`).join("")}</div>
        ${hasRed(st) ? `<div class="box-red">คุณเลือกอาการที่ต้องเฝ้าระวัง หลังบันทึกกรุณาติดต่อโรงพยาบาลโดยเร็วค่ะ</div>` : ""}`;
    }
  };

  async function submitInjection(st) {
    const m = medCfg(), d = st.draft, iv = intervalOf(st);
    const rec = {
      requestId: newRequestId(), penNumber: d.penNumber, doseNumber: d.doseNumber, penStrengthMg: d.penMg, doseMg: st.doseMg,
      clicks: clicksFor(m, st.doseMg, d.penMg), isSpecial: !!d.isSpecial, actualDate: st.date, intervalDays: iv,
      site: st.site, sideEffects: [...st.sides].map(i => cfg.sideEffects[i].label)
    };
    const before = patient;
    setPending([...getPending(), { kind: "injection", requestId: rec.requestId, payload: rec }]);
    patient = applyRecord(patient, rec); saveCache();
    sending = true;
    let pendingOnly = false;
    try {
      const r = await api("recordInjection", rec);
      removePending(rec.requestId);
      if (r.patient && r.patient.found) { patient = reapplyPending(r.patient); saveCache(); }
      try { historyCache = (await api("history")).injections || []; } catch (e) { historyCache = (historyCache || []).concat([{ date: rec.actualDate, interval: iv }]); }
    } catch (err) {
      if (isPermanent(err)) {
        removePending(rec.requestId); patient = before; saveCache(); sending = false;
        await showModal("บันทึกไม่สำเร็จ", err.message || "ข้อมูลไม่ถูกต้อง กรุณาตรวจสอบแล้วลองใหม่ค่ะ", "❌");
        return;
      }
      pendingOnly = true;
    }
    sending = false;
    showInjectDone(rec, pendingOnly, hasRed(st));
  }

  function showInjectDone(rec, pendingOnly, red) {
    const st = injStats(), n = Math.max(st.total, 1);
    const next = addDaysIso(rec.actualDate, rec.intervalDays);
    const msg = n === 1 ? "เข็มแรกของคุณ ต้นปังเริ่มงอกแล้ว 🌱"
      : n === BLOOM_AT ? `ครบ ${BLOOM_AT} เข็ม ต้นปังออกดอกแล้ว 🌼`
      : st.streak >= 2 ? `ฉีดตรงนัดติดกัน ${st.streak} ครั้ง เก่งมากค่ะ`
      : "ต้นปังงอกใบใหม่แล้ว ดูแลตัวเองดีมากค่ะ";
    $("doneBody").innerHTML = `
      ${red ? `<div class="box-red" style="text-align: left;"><b>🚑 อาการที่ต้องเฝ้าระวัง</b><br>กรุณาติดต่อโรงพยาบาลโดยเร็ว${cfg.hospitalContact ? `<br>${esc(cfg.hospitalContact)}` : ""}<br>หากหายใจลำบาก ให้ไปห้องฉุกเฉินหรือโทร 1669 ทันที</div>` : ""}
      <div class="plant-wrap">${plantSVG(n, { grow: true })}</div>
      <h1 class="h1">${pendingOnly ? "เก็บไว้ในเครื่องแล้ว" : "บันทึกแล้ว!"}</h1>
      <p class="lead">${pendingOnly ? "ยังส่งเข้าระบบไม่ได้ ระบบจะส่งให้อัตโนมัติเมื่อเปิดแอปครั้งถัดไป กรุณาอย่าบันทึกซ้ำนะคะ" : msg}</p>
      <div><span class="stat-pill"><span class="muted small">ด้าม / ครั้งที่</span><b>${rec.penNumber} / ${rec.doseNumber}${rec.isSpecial ? " ⭐" : ""}</b></span>
      <span class="stat-pill"><span class="muted small">นัดครั้งถัดไป</span><b>${thaiShort(next)}</b></span></div>`;
    showScreen("scrDone");
  }

  // ================== Wizard: น้ำหนัก ==================
  function startBodyWizard() {
    const all = bodyEntries();
    const lw = all.filter(e => e.weight).pop(), lwa = all.filter(e => e.waist).pop();
    const state = { date: localIso(), weight: lw ? String(lw.weight) : "", waist: lwa ? String(lwa.waist) : "", skipWaist: false, prev: lw || null };
    startWizard({ title: "บันทึกน้ำหนัก", state, steps: [STEP_WEIGHT, STEP_WAIST], onFinish: submitBody });
  }
  function stepper(el, st, key, step, min, max, unit) {
    el.innerHTML = `<div class="stepper"><button type="button" data-d="-1" aria-label="ลด">−</button>
      <input type="number" inputmode="decimal" id="stepIn" value="${esc(st[key])}" min="${min}" max="${max}" step="${step}" placeholder="0.0" aria-label="${unit}">
      <button type="button" data-d="1" aria-label="เพิ่ม">+</button></div><div class="unit">${unit}</div>`;
    const inp = el.querySelector("#stepIn");
    inp.oninput = () => { st[key] = inp.value; wzRefresh(); };
    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      const v = (Number(inp.value) || (key === "weight" ? 60 : 80)) + Number(b.dataset.d) * step;
      inp.value = String(Math.round(v * 10) / 10); st[key] = inp.value; wzRefresh();
    });
  }
  const STEP_WEIGHT = {
    q: "วันนี้น้ำหนักเท่าไหร่คะ?",
    sub: "แนะนำชั่งตอนเช้า หลังเข้าห้องน้ำ ก่อนทานอาหาร",
    render(el, st) {
      el.innerHTML = `<div id="wStep"></div>
        ${st.prev ? `<p class="muted" style="text-align: center; margin: 6px 0 0;">ครั้งก่อน ${fmt1(st.prev.weight)} กก. (${thaiShort(st.prev.date)})</p>` : ""}
        <div class="field" style="margin-top: 18px;"><label for="bDate">วันที่ชั่ง</label><input class="input" type="date" id="bDate" value="${st.date}" max="${localIso()}"></div>`;
      stepper(el.querySelector("#wStep"), st, "weight", 0.1, 20, 300, "กิโลกรัม");
      el.querySelector("#bDate").onchange = e => { st.date = e.target.value; wzRefresh(); };
    },
    valid: st => Number(st.weight) >= 20 && Number(st.weight) <= 300 && !!st.date && st.date <= localIso(),
    async beforeNext(st) {
      if (st.prev && Math.abs(Number(st.weight) - st.prev.weight) >= 5) {
        return await confirmModal("ตรวจสอบตัวเลข", `${fmt1(Number(st.weight))} กก. ต่างจากครั้งก่อน (${fmt1(st.prev.weight)} กก.) ค่อนข้างมาก\nยืนยันว่าถูกต้องใช่ไหมคะ?`, "ถูกต้อง");
      }
      return true;
    }
  };
  const STEP_WAIST = {
    q: "รอบเอววัดได้เท่าไหร่คะ?",
    sub: "วัดผ่านสะดือ ขณะหายใจออกตามปกติ ถ้าไม่ได้วัดก็ข้ามได้ค่ะ",
    next: st => st.skipWaist ? "บันทึก (ไม่ใส่รอบเอว)" : "บันทึก",
    render(el, st) {
      el.innerHTML = `<div id="waStep" style="opacity: ${st.skipWaist ? 0.35 : 1}; pointer-events: ${st.skipWaist ? "none" : "auto"};"></div>
        <div style="text-align: center; margin-top: 16px;"><button type="button" class="chip" id="skipW" aria-pressed="${st.skipWaist}">ไม่ได้วัดรอบเอววันนี้</button></div>`;
      stepper(el.querySelector("#waStep"), st, "waist", 0.5, 30, 250, "เซนติเมตร");
      el.querySelector("#skipW").onclick = () => { st.skipWaist = !st.skipWaist; rerenderStep(); };
    },
    valid: st => st.skipWaist || (Number(st.waist) >= 30 && Number(st.waist) <= 250)
  };

  async function submitBody(st) {
    const requestId = newRequestId();
    const payload = { requestId, date: st.date, weightKg: st.weight, waistCm: st.skipWaist ? "" : st.waist };
    const firstBefore = bodyEntries().filter(e => e.weight)[0];
    setPending([...getPending(), { kind: "body", requestId, payload }]);
    let pendingOnly = false;
    try {
      const r = await api("recordBody", payload);
      removePending(requestId);
      bodyCache = r.entries || bodyCache;
    } catch (err) {
      if (isPermanent(err)) { removePending(requestId); await showModal("บันทึกไม่สำเร็จ", err.message || "กรุณาตรวจสอบข้อมูลค่ะ", "❌"); return; }
      pendingOnly = true;
    }
    const w = Number(st.weight), prev = st.prev;
    let line = "บันทึกน้ำหนักครั้งแรกแล้ว จุดเริ่มต้นที่ดีค่ะ";
    if (prev) {
      const d = w - prev.weight;
      line = d < -0.05 ? `ลดลง ${fmt1(-d)} กก. จากครั้งก่อน เยี่ยมมากค่ะ` : d > 0.05 ? `เพิ่มขึ้น ${fmt1(d)} กก. ไม่เป็นไรนะคะ ค่อยๆ ไปด้วยกัน` : "เท่ากับครั้งก่อน รักษาไว้ได้ดีมากค่ะ";
    }
    let milestone = "";
    if (firstBefore && w < firstBefore.weight) {
      const pct = (firstBefore.weight - w) / firstBefore.weight * 100;
      const prevPct = prev ? (firstBefore.weight - prev.weight) / firstBefore.weight * 100 : 0;
      const hit = [10, 5].find(t => pct >= t && prevPct < t);
      if (hit) milestone = `<div class="box-info" style="background: var(--sun-soft); color: #7A5200;">🏅 น้ำหนักลดลงครบ ${hit}% จากครั้งแรกแล้ว!</div>`;
    }
    const total = firstBefore ? firstBefore.weight - w : 0;
    $("doneBody").innerHTML = `
      <div class="plant-wrap" style="width: 170px;">${plantSVG(injStats().total, { sway: true })}</div>
      <h1 class="h1">${pendingOnly ? "เก็บไว้ในเครื่องแล้ว" : "บันทึกแล้ว!"}</h1>
      <p class="lead">${pendingOnly ? "ระบบจะส่งเข้าระบบให้อัตโนมัติเมื่อเปิดแอปครั้งถัดไปค่ะ" : line}</p>
      ${milestone}
      <div><span class="stat-pill"><span class="muted small">น้ำหนักวันนี้</span><b>${fmt1(w)} กก.</b></span>
      ${total > 0.05 ? `<span class="stat-pill"><span class="muted small">ลดไปแล้วทั้งหมด</span><b>${fmt1(total)} กก.</b></span>` : ""}</div>`;
    showScreen("scrDone");
  }

          next: st => (st.weight || st.height || st.waist) ? "เสร็จสิ้น" : "ข้ามและเสร็จสิ้น",
          render(el, st) {
            el.innerHTML = [["height", "ส่วนสูง (ซม.)", "160"], ["weight", "น้ำหนัก (กก.)", "75.5"], ["waist", "รอบเอว (ซม.)", "90"]].map(([k, l, ph]) =>

  async function submitRegister(st) {

        <p class="lead">ต้นปังพร้อมเติบโตไปกับคุณแล้ว<br>ฉีดยาเสร็จเมื่อไหร่ กดบันทึกได้เลยนะคะ</p>`;
